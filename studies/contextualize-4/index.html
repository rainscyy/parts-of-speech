<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contextualize / 04</title><link rel="stylesheet" href="style.css"></head><body><header><span>CONTEXTUALIZE / 04</span><nav aria-label="Video"><button data-scene="court" aria-pressed="true">01 毽子</button><button data-scene="coast" aria-pressed="false">02 海边</button><button data-scene="rings" aria-pressed="false">03 拉环</button></nav><button id="reset" aria-label="Reset reveal">↺</button></header><main><div id="scene"><canvas id="view" width="960" height="540" aria-label="Video fragments. Move to reveal the surroundings."></canvas><span id="loading" role="status">载入中</span></div></main><footer><button id="play" aria-label="Pause video">Ⅱ</button><label for="reveal">CONTEXT <input id="reveal" type="range" min="0" max="100" value="0"><output id="amount">00%</output></label><button id="all">全部显示 ↗</button></footer><video id="film" muted playsinline loop preload="auto" hidden></video><script src="app.js"></script><script>if(parent!==window){addEventListener("wheel",e=>{if(e.ctrlKey||e.target.closest("input"))return;e.preventDefault();parent.postMessage({type:"study-wheel",delta:Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY},location.origin)},{passive:false})}</script></body></html>
