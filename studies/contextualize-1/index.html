<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contextualize — Produce</title><link rel="stylesheet" href="style.css"></head>
<body><header><span>WEEKLY VERB STUDIES</span><h1>Contextualize</h1><span>01 / ILLUSTRATIVE</span></header><main><div class="stage" id="stage" tabindex="0" aria-label="Vegetable shelf: move to reveal, click to contextualize, click again to return"><img id="base" class="base" alt="Fresh vegetables on supermarket shelves"><div id="words" class="words" aria-hidden="true"></div><img id="color" class="color" alt=""><div id="box" class="box"><div id="label" class="label"></div><span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span></div><div id="targets" class="targets"></div><div class="reticle" id="reticle"></div></div></main><footer><div class="photos" aria-label="Choose photograph"><button data-photo="0" aria-label="Shelf 1" aria-pressed="true">01</button><button data-photo="1" aria-label="Shelf 2" aria-pressed="false">02</button><button data-photo="2" aria-label="Shelf 3" aria-pressed="false">03</button></div><span id="hint">MOVE TO REVEAL · CLICK TO CONTEXTUALIZE</span><span class="prices">PRICES: PHOTO / DEMO</span></footer><script src="app.js"></script><script>if(parent!==window){addEventListener('wheel',e=>{if(e.ctrlKey||e.target.closest('#tray,dialog,input'))return;e.preventDefault();parent.postMessage({type:'study-wheel',delta:Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY},location.origin)},{passive:false})}</script></body></html>
