</style><header><h1 class="brand">RAINE <span>PARTS OF SPEECH</span></h1><nav aria-label="Study groups"><button data-verb="Wake">Wake</button><button data-verb="Encircle">Encircle</button><button data-verb="Punch">Punch</button><button data-verb="Wipe">Wipe</button></nav></header><main id="gallery" tabindex="0" aria-label="Interactive studies. Scroll horizontally or use the arrow buttons."><div class="track" id="track"></div></main><footer><div class="progress" id="scrubber" role="slider" tabindex="0" aria-label="Browse studies" aria-valuemin="1" aria-valuemax="10" aria-valuenow="1"><span id="progress"></span></div><div class="controls"><button id="previous" aria-label="Previous study">←</button><span id="count">01 / 10</span><button id="next" aria-label="Next study">→</button></div></footer><script>
const gallery=document.getElementById('gallery'),track=document.getElementById('track');let works=[],active=0,lastActive=-1,activationTimer=0;const suppressed=new Set();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
// One motion controller for wheel, navigation and a released drag.
let motionTarget=0,motionRaf=0,drag=null,bridgeDrag=null,ignoreClickUntil=0;
const limit=()=>Math.max(0,gallery.scrollWidth-gallery.clientWidth);

function moveTo(target){motionTarget=clamp(target);clearTimeout(activationTimer);if(reduced){gallery.scrollLeft=motionTarget;update();schedule();return}if(motionRaf)return;let last=performance.now();function step(now){const dt=Math.min(50,now-last);last=now;const gap=motionTarget-gallery.scrollLeft;gallery.scrollLeft+=gap*(1-Math.exp(-dt/115));update();if(Math.abs(gap)>5)motionRaf=requestAnimationFrame(step);else{gallery.scrollLeft=motionTarget;motionRaf=0;update();schedule()}}motionRaf=requestAnimationFrame(step)}
function wheelBy(delta){moveTo((motionRaf?motionTarget:gallery.scrollLeft)+delta)}
function go(index){const w=works[Math.max(0,Math.min(works.length-1,index))];if(w)moveTo(w.offsetLeft-(gallery.clientWidth-w.clientWidth)/2)}
function layoutGallery(){if(!works.length)return;track.style.paddingLeft=Math.max(24,(gallery.clientWidth-works[0].clientWidth)/2)+'px';track.style.paddingRight=Math.max(24,(gallery.clientWidth-works.at(-1).clientWidth)/2)+'px';update()}
gallery.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.restart'))return;stopMotion();drag={id:e.pointerId,x:e.clientX,start:gallery.scrollLeft,lastX:e.clientX,lastTime:performance.now(),velocity:0,moved:false}});
gallery.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const now=performance.now(),dx=e.clientX-drag.x;if(!drag.moved&&Math.abs(dx)<6)return;if(!drag.moved){drag.moved=true;gallery.setPointerCapture(e.pointerId);gallery.classList.add('dragging')}e.preventDefault();const dt=Math.max(8,now-drag.lastTime);drag.velocity=drag.velocity*.35+(drag.lastX-e.clientX)/dt*.65;drag.lastX=e.clientX;drag.lastTime=now;gallery.scrollLeft=clamp(drag.start-dx);update()});
function endDrag(e){if(!drag||drag.id!==e.pointerId)return;const d=drag;drag=null;gallery.classList.remove('dragging');if(gallery.hasPointerCapture(e.pointerId))gallery.releasePointerCapture(e.pointerId);if(d.moved){ignoreClickUntil=performance.now()+350;const speed=performance.now()-d.lastTime<100?Math.max(-3,Math.min(3,d.velocity)):0;moveTo(gallery.scrollLeft+(reduced?0:speed*210))}else schedule()}
gallery.addEventListener('pointerup',endDrag);gallery.addEventListener('pointercancel',endDrag);
gallery.addEventListener('click',e=>{if(performance.now()<ignoreClickUntil){e.preventDefault();e.stopImmediatePropagation()}},true);
gallery.addEventListener('dragstart',e=>e.preventDefault());
function closeWork(w,manual=false){clearTimeout(w.previewTimer);w.centeredSince=null;w.previewReady=false;const frame=w.querySelector('iframe');if(frame)frame.remove();w.querySelector('.surface').classList.remove('is-live');const button=w.querySelector('.restart');button.textContent='↗';button.setAttribute('aria-label','Activate '+w.dataset.title);w.dataset.live='false';if(manual)suppressed.add(w.dataset.id)}
function activateWork(w){if(w.dataset.live==='true')return;const surface=w.querySelector('.surface'),iframe=document.createElement('iframe');iframe.title=w.dataset.verb+' — '+w.dataset.title;iframe.allow='autoplay';iframe.src=w.dataset.entry;w.dataset.live='true';const button=w.querySelector('.restart');button.textContent='×';button.setAttribute('aria-label','Close '+w.dataset.title);w.previewImmediate=false;w.previewReady=false;w.centeredSince=null;w.revealPreview=()=>{if(!iframe.isConnected)return;surface.classList.add('is-live');if(!reduced)iframe.contentWindow.postMessage({type:'study-preview-start'},location.origin)};iframe.onload=()=>{w.previewReady=true;if(w.dataset.id!=='punch-4'||w.previewImmediate)w.previewTimer=setTimeout(w.revealPreview,0)};surface.append(iframe)}
function schedule(){clearTimeout(activationTimer);const w=works[active];if(!w||w.dataset.visible!=='true'||suppressed.has(w.dataset.id)||drag||scrubbing||bridgeDrag)return;activateWork(w)}
function update(){if(!works.length)return;const center=gallery.scrollLeft+gallery.clientWidth/2;for(const w of works){const distance=(w.offsetLeft+w.clientWidth/2-center)/(gallery.clientWidth*.65);const focus=Math.exp(-distance*distance*2);const scale=reduced?1:.90+.145*focus;const tilt=reduced?0:Math.max(-1,Math.min(1,distance))*-5;w.motionScale=scale;w.motionTilt=tilt;w.surfaceHeight=w.querySelector('.surface').clientHeight;if(reduced)w.querySelector('.surface').style.transform='none';w.style.setProperty('--focus-opacity',.65+.35*focus)}active=works.reduce((best,w,i)=>Math.abs(w.offsetLeft+w.clientWidth/2-center)<Math.abs(works[best].offsetLeft+works[best].clientWidth/2-center)?i:best,0);if(active!==lastActive){if(lastActive>=0){suppressed.delete(works[lastActive].dataset.id);if(!bridgeDrag&&works[lastActive].dataset.visible!=='true')closeWork(works[lastActive])}lastActive=active;schedule()}document.getElementById('count').textContent=String(active+1).padStart(2,'0')+' / '+works.length;document.getElementById('previous').disabled=active===0;document.getElementById('next').disabled=active===works.length-1;document.getElementById('progress').style.width=((active+1)/works.length*100)+'%';const scrubber=document.getElementById('scrubber');scrubber.style.setProperty('--position',(limit()?gallery.scrollLeft/limit()*100:0)+'%');scrubber.setAttribute('aria-valuenow',active+1);scrubber.setAttribute('aria-valuemax',works.length);document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.verb===works[active].dataset.verb))}
// Quiet motion continues between gestures; hovering gently brings a card forward.
let ambientLast=performance.now();
function ambient(now){for(const w of works){if(w.dataset.id!=='punch-4'||!w.previewReady||w.querySelector('.surface').classList.contains('is-live'))continue;const centered=Math.abs(w.offsetLeft+w.clientWidth/2-gallery.scrollLeft-gallery.clientWidth/2)<Math.max(16,gallery.clientWidth*.025)&&!drag&&!bridgeDrag&&!scrubbing&&!motionRaf;if(!centered){w.centeredSince=null;continue}if(w.centeredSince===null)w.centeredSince=now;if(now-w.centeredSince>=650)w.revealPreview?.()}const dt=Math.min(.05,(now-ambientLast)/1000);ambientLast=now;if(!reduced&&!document.hidden){works.forEach((w,i)=>{if(w.dataset.visible!=='true')return;if(!w.hoverBound){w.hoverBound=true;w.addEventListener('pointerenter',()=>w.hoverTarget=1);w.addEventListener('pointerleave',()=>w.hoverTarget=0)}w.hoverAmount=(w.hoverAmount||0)+((w.hoverTarget||0)-(w.hoverAmount||0))*(1-Math.exp(-dt*8));const h=w.hoverAmount,t=now*.00065+i*1.7;const quiet=1-h,dy=Math.sin(t)*2.5*quiet-h*3,scale=(w.motionScale||1)+h*.018;w.querySelector('.caption').style.transform=`translateY(${(scale-1)*(w.surfaceHeight||0)/2+dy}px)`;w.querySelector('.surface').style.transform=`perspective(1400px) translateY(${dy}px) rotateY(${(w.motionTilt||0)+Math.sin(t*.8)*.5*quiet}deg) rotateZ(${Math.sin(t*.7)*.16*quiet}deg) scale(${scale})`;})}requestAnimationFrame(ambient)}requestAnimationFrame(ambient);
gallery.addEventListener('scroll',update,{passive:true});gallery.addEventListener('wheel',e=>{if(!e.ctrlKey){e.preventDefault();const delta=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;wheelBy(delta*(e.deltaMode===1?16:e.deltaMode===2?gallery.clientWidth:1))}},{passive:false});window.addEventListener('message',e=>{
 if(e.origin!==location.origin)return;
 const work=works.find(w=>w.querySelector('iframe')?.contentWindow===e.source);if(!work)return;
 if(e.data?.type==='study-wheel'){wheelBy(Number(e.data.delta)||0);return}
 if(e.data?.type==='study-drag-start'){stopMotion();bridgeDrag={work,start:gallery.scrollLeft,last:0,time:performance.now(),velocity:0};gallery.classList.add('dragging');return}
 if(e.data?.type==='study-drag-move'&&bridgeDrag?.work===work){
  const now=performance.now(),d=Number(e.data.dx)||0,ratio=1;
  const x=d*ratio,dt=Math.max(8,now-bridgeDrag.time);bridgeDrag.velocity=bridgeDrag.velocity*.35+(bridgeDrag.last-x)/dt*.65;bridgeDrag.last=x;bridgeDrag.time=now;
  gallery.scrollLeft=clamp(bridgeDrag.start-x);update();return;
 }
 if(e.data?.type==='study-drag-end'&&bridgeDrag?.work===work){
  const d=bridgeDrag;bridgeDrag=null;gallery.classList.remove('dragging');works.filter(w=>w!==works[active]&&w.dataset.visible!=='true').forEach(w=>closeWork(w));
  const speed=performance.now()-d.time<100?Math.max(-3,Math.min(3,d.velocity)):0;moveTo(gallery.scrollLeft+(reduced?0:speed*210));
 }
});document.getElementById('previous').onclick=()=>go(active-1);document.getElementById('next').onclick=()=>go(active+1);gallery.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(active+(e.key==='ArrowRight'?1:-1))}});document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(works.findIndex(w=>w.dataset.verb===b.dataset.verb)));
const scrubber=document.getElementById('scrubber');let scrubbing=false;function scrub(e){const r=scrubber.getBoundingClientRect();gallery.scrollLeft=clamp((e.clientX-r.left)/r.width*limit());update()}scrubber.addEventListener('pointerdown',e=>{stopMotion();scrubbing=true;scrubber.setPointerCapture(e.pointerId);scrub(e)});scrubber.addEventListener('pointermove',e=>{if(scrubbing)scrub(e)});scrubber.addEventListener('pointerup',()=>{scrubbing=false;schedule()});scrubber.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();go(active+(e.key==='ArrowRight'?1:-1))}});
const previewVisibility=new IntersectionObserver(entries=>{for(const entry of entries){const w=entry.target;w.dataset.visible=String(entry.isIntersecting);if(entry.isIntersecting&&!suppressed.has(w.dataset.id))activateWork(w);else if(!entry.isIntersecting&&bridgeDrag?.work!==w)closeWork(w)}},{root:gallery,threshold:0});
fetch('manifest.json').then(r=>r.json()).then(studies=>{for(const item of studies){const hasCover=Boolean(item.cover?.startsWith('covers/'));const work=document.createElement('article');work.className='work';Object.assign(work.dataset,{id:item.id,verb:item.verb,title:item.title,entry:item.entry,live:'false',hasCover:String(hasCover)});work.innerHTML=`<div class="surface">${hasCover?`<img src="${item.cover}" draggable="false" alt="${item.title} cover">`:""}<button class="cover-button" aria-label="Activate ${item.title}"></button></div><div class="caption"><h2>${item.title}</h2><button class="restart" aria-label="Activate ${item.title}">↗</button></div>`;function toggle(){clearTimeout(activationTimer);if(work.dataset.live==='true'){if(!work.querySelector('.surface').classList.contains('is-live')){work.previewImmediate=true;clearTimeout(work.previewTimer);work.revealPreview?.();return}closeWork(work,true);return}suppressed.delete(item.id);const index=works.indexOf(work);if(index!==active){go(index);activationTimer=setTimeout(()=>activateWork(work),700)}else activateWork(work)}work.querySelector('.cover-button').onclick=toggle;work.querySelector('.restart').onclick=toggle;track.append(work)}works=[...track.children];layoutGallery();works.forEach(w=>previewVisibility.observe(w))});window.addEventListener('resize',layoutGallery);
</script></html>
